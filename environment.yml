name: uscanopy
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - numpy=2.4.6
  - pandas=2.3.0
  - scipy=1.15.3
  - statsmodels=0.14.5
  - scikit-learn=1.7.0
  - geopandas=1.1.1
  - shapely=2.1.1
  - pyproj=3.7.1
  - rasterio=1.4.3
  - matplotlib=3.10.5
  - pillow=11.2.1
  - scikit-image=0.25.2
  - requests=2.32.4
  - python-docx=1.2.0
  - pip
  - pip:
      - pygam==0.12.0
      - pystac-client==0.9.0
      - planetary-computer==1.0.0
      - torch==2.7.1
      - torchvision==0.22.1

